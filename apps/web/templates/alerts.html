{% extends "base.html" %}

{% block title %}Alerts - Phantom Mission Control{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <h4 class="mb-4">
            <i class="bi bi-bell text-accent"></i>
            Security Alerts
        </h4>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card stat-card red">
            <div class="stat-value" id="criticalCount">0</div>
            <div class="stat-label">Critical</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card yellow">
            <div class="stat-value" id="highCount">0</div>
            <div class="stat-label">High</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card stat-card green">
            <div class="stat-value" id="totalCount">0</div>
            <div class="stat-label">Total</div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-list-ul"></i> Alert History
            </div>
            <div class="card-body p-0">
                <div id="alertsList" class="log-container" style="max-height: 500px;">
                    <div class="text-center py-4 text-muted">
                        <i class="bi bi-bell-slash" style="font-size: 2rem;"></i>
                        <p class="mt-2">No alerts</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function emptyAlerts(message, icon = 'bi-bell-slash') {
    return `<div class="text-center py-4 text-muted"><i class="bi ${icon}" style="font-size: 2rem;"></i><p class="mt-2">${message}</p></div>`;
}

function loadAlerts() {
    fetch('/api/alerts')
        .then(r => r.json())
        .then(data => {
            const list = document.getElementById('alertsList');
            const alerts = data.alerts || [];

            if (alerts.length === 0) {
                list.innerHTML = emptyAlerts('No alerts');
            } else {
                list.innerHTML = '';
                alerts.forEach(a => {
                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.style.justifyContent = 'space-between';

                    const sev = document.createElement('span');
                    sev.className = 'log-badge ' + (a.severity === 'critical' ? 'detection' : a.severity === 'high' ? 'process' : 'file');
                    sev.textContent = (a.severity || 'unknown').toUpperCase();
                    row.appendChild(sev);

                    const title = document.createElement('span');
                    title.className = 'text-light flex-fill mx-2 text-truncate';
                    title.style.minWidth = '0';
                    title.textContent = a.title || 'Alert';
                    row.appendChild(title);

                    const status = document.createElement('span');
                    status.className = 'text-muted small d-none d-md-inline';
                    status.textContent = (a.status || 'pending') + ' · ' + (a.created ? new Date(a.created).toLocaleString() : '');
                    row.appendChild(status);

                    if (['pending', 'routed'].includes(a.status)) {
                        const acknowledge = document.createElement('button');
                        acknowledge.className = 'btn btn-sm btn-outline-accent ms-2';
                        acknowledge.setAttribute('aria-label', 'Acknowledge ' + (a.title || 'alert'));
                        acknowledge.innerHTML = '<i class="bi bi-check"></i>';
                        acknowledge.addEventListener('click', () => acknowledgeAlert(a.alert_id));
                        row.appendChild(acknowledge);
                    }

                    if (['pending', 'routed', 'acknowledged'].includes(a.status)) {
                        const resolve = document.createElement('button');
                        resolve.className = 'btn btn-sm btn-outline-accent ms-1';
                        resolve.setAttribute('aria-label', 'Resolve ' + (a.title || 'alert'));
                        resolve.innerHTML = '<i class="bi bi-check-all"></i>';
                        resolve.addEventListener('click', () => resolveAlert(a.alert_id));
                        row.appendChild(resolve);
                    }

                    list.appendChild(row);
                });
            }
        })
        .catch(err => {
            console.error('Error loading alerts:', err);
            document.getElementById('alertsList').innerHTML = emptyAlerts('Failed to load alerts', 'bi-wifi-off');
        });

    // Load stats
    fetch('/api/alert-stats')
        .then(r => r.json())
        .then(data => {
            document.getElementById('criticalCount').textContent = data.by_severity?.critical || 0;
            document.getElementById('highCount').textContent = data.by_severity?.high || 0;
            document.getElementById('totalCount').textContent = data.total || 0;
        })
        .catch(err => console.error('Error loading stats:', err));
}

function acknowledgeAlert(id) {
    fetch('/api/alerts/' + id + '/acknowledge', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            loadAlerts();
        })
        .catch(err => alert('Error: ' + err.message));
}

function resolveAlert(id) {
    fetch('/api/alerts/' + id + '/resolve', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            loadAlerts();
        })
        .catch(err => alert('Error: ' + err.message));
}

// Load on page load
loadAlerts();

// Auto-refresh every 15 seconds
setInterval(loadAlerts, 15000);
</script>
{% endblock %}
