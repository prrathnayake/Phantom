{% extends "base.html" %}

{% block title %}Approvals - Phantom Mission Control{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-12">
        <h4 class="mb-4">
            <i class="bi bi-check-circle text-accent"></i>
            Approval Requests
        </h4>
    </div>
</div>

<div class="row g-3 mb-4">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-body text-center py-4" id="pendingCard">
                <i class="bi bi-hourglass-split" style="font-size: 3rem; color: var(--text-muted);"></i>
                <h5 class="mt-3">Pending Approvals</h5>
                <p class="text-muted">Approval requests requiring your action will appear here.</p>
                <div id="approvalsLoading" class="spinner-border text-accent my-3" style="display: none;"></div>
            </div>
        </div>
    </div>
</div>

<div class="row g-3">
    <div class="col-lg-12">
        <div class="card">
            <div class="card-header">
                <i class="bi bi-list-check"></i> Approval History
            </div>
            <div class="card-body p-0">
                <div id="approvalsList" class="log-container" style="max-height: 400px;">
                    <div class="text-center py-4 text-muted">
                        <i class="bi bi-inbox" style="font-size: 2rem;"></i>
                        <p class="mt-2">No approval history</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function emptyApprovals(message, icon = 'bi-inbox') {
    return `<div class="text-center py-4 text-muted"><i class="bi ${icon}" style="font-size: 2rem;"></i><p class="mt-2">${message}</p></div>`;
}

function appendText(parent, className, text) {
    const el = document.createElement('span');
    el.className = className;
    el.textContent = text;
    parent.appendChild(el);
    return el;
}

function loadApprovals() {
    document.getElementById('approvalsLoading').style.display = 'block';

    fetch('/api/approvals')
        .then(r => r.json())
        .then(data => {
            document.getElementById('approvalsLoading').style.display = 'none';
            const list = document.getElementById('approvalsList');
            const pending = data.approvals || [];
            const pendingCard = document.getElementById('pendingCard');

            if (pending.length === 0) {
                list.innerHTML = emptyApprovals('No pending approvals');
                pendingCard.innerHTML = '<i class="bi bi-check-circle" style="font-size: 3rem; color: var(--success);"></i><h5 class="mt-3">All Caught Up</h5><p class="text-muted">No approvals pending your review.</p>';
            } else {
                pendingCard.innerHTML = '<i class="bi bi-hourglass-split" style="font-size: 3rem; color: var(--warning);"></i><h5 class="mt-3">' + pending.length + ' Pending Approval' + (pending.length > 1 ? 's' : '') + '</h5><p class="text-muted">Review and approve or deny the requests below.</p>';
                list.innerHTML = '';
                pending.forEach(a => {
                    const row = document.createElement('div');
                    row.className = 'log-entry';
                    row.style.justifyContent = 'space-between';

                    appendText(row, 'log-badge ' + (['HIGH', 'CRITICAL'].includes(a.risk_level) ? 'detection' : 'process'), a.risk_level || 'LOW');
                    const action = appendText(row, 'text-light flex-fill mx-2 text-truncate', a.action_type_display || 'Action');
                    action.style.minWidth = '0';
                    action.title = a.reason || '';
                    appendText(row, 'text-muted small d-none d-md-inline text-truncate', a.reason || '');

                    const approve = document.createElement('button');
                    approve.className = 'btn btn-sm btn-accent ms-2';
                    approve.setAttribute('aria-label', 'Approve ' + (a.action_type_display || 'action'));
                    approve.innerHTML = '<i class="bi bi-check"></i>';
                    approve.addEventListener('click', () => approveAction(a.approval_id));
                    row.appendChild(approve);

                    const deny = document.createElement('button');
                    deny.className = 'btn btn-sm btn-outline-accent ms-1';
                    deny.setAttribute('aria-label', 'Deny ' + (a.action_type_display || 'action'));
                    deny.innerHTML = '<i class="bi bi-x"></i>';
                    deny.addEventListener('click', () => denyAction(a.approval_id));
                    row.appendChild(deny);

                    list.appendChild(row);
                });
            }
        })
        .catch(err => {
            document.getElementById('approvalsLoading').style.display = 'none';
            console.error('Error loading approvals:', err);
            document.getElementById('approvalsList').innerHTML = emptyApprovals('Failed to load approvals', 'bi-wifi-off');
        });
}

function approveAction(id) {
    if (!confirm('Approve this action?')) return;
    
    fetch('/api/approvals/' + id + '/approve', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            alert('Action approved!');
            loadApprovals();
        })
        .catch(err => alert('Error: ' + err.message));
}

function denyAction(id) {
    if (!confirm('Deny this action?')) return;
    
    fetch('/api/approvals/' + id + '/deny', {method: 'POST'})
        .then(r => r.json())
        .then(data => {
            alert('Action denied');
            loadApprovals();
        })
        .catch(err => alert('Error: ' + err.message));
}

// Load on page load
loadApprovals();

// Auto-refresh every 30 seconds
setInterval(loadApprovals, 30000);
</script>
{% endblock %}
