<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phantom Mission Control{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" href="data:,">
    <style>
        :root {
            color-scheme: dark;
            --bg-dark: #080b0a;
            --bg-card: #0d1411;
            --bg-card-hover: #132019;
            --border: #1c3027;
            --border-light: #315545;
            --text-primary: #d9ffe5;
            --text-secondary: #9fe9b3;
            --text-muted: #78a886;
            --accent: #35f27d;
            --accent-dim: #1f9f55;
            --accent-glow: rgba(53, 242, 125, 0.14);
            --success: #35f27d;
            --warning: #facc15;
            --danger: #ff5c5c;
            --info: #67e8f9;
            --terminal-glow: 0 0 10px rgba(53, 242, 125, 0.35);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', 'Courier New', monospace;
            min-height: 100vh;
            cursor: text;
            overflow-x: hidden;
            -webkit-tap-highlight-color: rgba(53, 242, 125, 0.18);
        }
        
        ::selection {
            background: var(--accent);
            color: var(--bg-dark);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 0;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }
        
        a {
            color: var(--accent);
            text-decoration: none;
        }
        
        a:hover {
            text-decoration: underline;
            text-shadow: var(--terminal-glow);
        }
        
        input, textarea, select {
            background: var(--bg-dark) !important;
            color: var(--accent) !important;
            border: 1px solid var(--accent-dim) !important;
            font-family: 'JetBrains Mono', monospace !important;
        }
        
        input:focus, textarea:focus, select:focus {
            border-color: var(--accent) !important;
            box-shadow: var(--terminal-glow);
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
            box-shadow: var(--terminal-glow);
        }

        .skip-link {
            position: fixed;
            left: 1rem;
            top: 1rem;
            z-index: 10000;
            transform: translateY(-200%);
            background: var(--accent);
            color: var(--bg-dark);
            padding: 0.5rem 0.75rem;
            font-weight: 700;
        }

        .skip-link:focus-visible {
            transform: translateY(0);
        }
        
        input::placeholder, textarea::placeholder {
            color: var(--text-muted) !important;
        }
        
        /* Navbar - Terminal Style */
        .navbar {
            background: var(--bg-dark);
            border-bottom: 1px solid var(--accent-dim);
            padding: 0.5rem 1rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar .container-fluid {
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        
        .navbar-brand {
            font-weight: 600;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--accent) !important;
        }
        
        .navbar-brand i {
            color: var(--accent);
            font-size: 1.2rem;
            text-shadow: var(--terminal-glow);
        }
        
        .nav-pills .nav-link {
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
            border: 1px solid transparent;
            gap: 0.5rem;
        }

        .nav-pills {
            gap: 0.5rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .nav-pills .nav-link:hover {
            color: var(--accent);
            border-color: var(--accent-dim);
            text-shadow: var(--terminal-glow);
        }
        
        .nav-pills .nav-link.active {
            background: transparent;
            color: var(--accent);
            border-color: var(--accent);
            text-shadow: var(--terminal-glow);
        }
        
        .nav-pills .nav-link i {
            margin-right: 0.375rem;
        }
        
        /* Status badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background: var(--bg-card);
            border: 1px solid var(--accent-dim);
            font-size: 0.7rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; box-shadow: var(--terminal-glow); }
            50% { opacity: 0.5; }
        }
        
        .status-dot.online { background: var(--success); box-shadow: var(--terminal-glow); }
        .status-dot.warning { background: var(--warning); box-shadow: 0 0 5px var(--warning); }
        .status-dot.offline { background: var(--danger); box-shadow: 0 0 5px var(--danger); }
        
        /* Cards - Terminal Style */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--accent-dim);
            border-radius: 0;
            overflow: hidden;
        }
        
        .card:hover {
            border-color: var(--accent);
            box-shadow: var(--terminal-glow);
        }
        
        .card-header {
            background: var(--bg-dark);
            border-bottom: 1px solid var(--accent-dim);
            padding: 0.75rem 1rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-header i {
            margin-right: 0.5rem;
            color: var(--accent);
        }
        
        .card-body {
            padding: 1.25rem;
        }
        
        /* Stats cards */
        .stat-card {
            text-align: center;
            padding: 1.5rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.25rem;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .stat-card.green .stat-value { color: var(--success); }
        .stat-card.yellow .stat-value { color: var(--warning); }
        .stat-card.red .stat-value { color: var(--danger); }
        .stat-card.blue .stat-value { color: var(--info); }

        /* Text colors */
        .text-accent { color: var(--accent); }
        .text-success { color: var(--success); }
        .text-warning { color: var(--warning); }
        .text-danger { color: var(--danger); }
        .text-info { color: var(--info); }
        .text-muted { color: var(--text-muted); }
        .text-secondary { color: var(--text-secondary); }
        .text-light { color: var(--text-primary); }
        
        /* Buttons - Terminal Style */
        .btn-accent {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .btn-accent:hover {
            background: var(--accent);
            box-shadow: var(--terminal-glow);
        }
        
        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent-dim);
            font-family: 'JetBrains Mono', monospace;
        }
        
        .btn-outline-accent:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
            box-shadow: var(--terminal-glow);
        }
        
        /* Log entries */
        .log-container {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        
        .log-entry {
            padding: 0.5rem 0.75rem;
            border-bottom: 1px solid var(--accent-dim);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
        }
        
        .log-entry:hover {
            background: var(--bg-card);
            color: var(--accent);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-timestamp {
            color: var(--text-muted);
            font-size: 0.65rem;
            white-space: nowrap;
        }
        
        .log-badge {
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            flex-shrink: 0;
        }
        
        .log-badge.process { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .log-badge.port { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .log-badge.file { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .log-badge.detection { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        /* Activity indicator */
        .activity-pulse {
            position: fixed;
            top: 4.5rem;
            left: 1.5rem;
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: activity-pulse 1.5s infinite;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .activity-pulse::after {
            content: 'Activity';
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-left: 0.75rem;
            white-space: nowrap;
        }
        
        @keyframes activity-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* Quick action cards */
        .action-card {
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .action-card:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        
        .action-card i {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }
        
        .action-card h6 {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .action-card p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0;
        }
        
        /* Sidebar */
        .sidebar {
            background: var(--bg-card);
            border: 1px solid var(--accent-dim);
            padding: 1rem;
        }
        
        .sidebar-section {
            margin-bottom: 1.5rem;
        }
        
        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--accent);
            font-family: 'JetBrains Mono', monospace;
            margin-bottom: 0.75rem;
        }
        
        .doc-nav .nav-link:hover {
            padding-left: 0.5rem;
        }
        
        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }
        
        .chat-widget-btn {
            position: relative;
            width: 50px;
            height: 50px;
            background: var(--bg-dark);
            border: 2px solid var(--accent);
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: var(--accent);
            box-shadow: var(--terminal-glow);
            z-index: 9999;
            flex-shrink: 0;
        }

        .chat-widget-btn .notification-badge {
            position: absolute;
            top: -5px;
            right: -5px;
            background: var(--danger);
            color: var(--bg-dark);
            font-size: 0.6rem;
            font-weight: bold;
            min-width: 16px;
            height: 16px;
            display: none;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--accent);
        }

        .chat-widget-btn .notification-badge.show {
            display: flex;
        }

        @keyframes notifPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .chat-widget-btn:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 30px rgba(34, 197, 94, 0.5);
        }

        .chat-widget-btn::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--accent);
            animation: chatPulse 2s infinite;
            z-index: -1;
        }

        @keyframes chatPulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 0; }
            100% { transform: scale(1); opacity: 0; }
        }

        .chat-widget-btn .bi {
            transition: transform 0.3s ease;
        }

        .chat-widget-btn:hover .bi {
            transform: rotate(10deg);
        }

        .chat-widget-btn .bi-chat-dots-fill {
            display: block;
        }

        .chat-widget-btn .bi-x-lg {
            display: none;
        }

        .chat-widget-btn.open .bi-chat-dots-fill {
            display: none;
        }

        .chat-widget-btn.open .bi-x-lg {
            display: block;
        }

        .chat-widget-popup {
            position: fixed;
            bottom: 5.5rem;
            right: 1.5rem;
            width: 380px;
            height: 500px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            z-index: 9998;
            display: none;
            flex-direction: column;
            overflow: hidden;
            animation: chatSlideUp 0.3s ease-out;
        }

        .chat-widget-popup.show {
            display: flex;
        }

        .chat-widget-popup.fullscreen {
            width: calc(100vw - 2rem);
            height: calc(100vh - 6rem);
            bottom: 1rem;
            right: 1rem;
        }

        @keyframes chatSlideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .chat-widget-header {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .chat-widget-header i {
            font-size: 1.5rem;
            color: var(--bg-dark);
        }

        .chat-widget-header div {
            color: var(--bg-dark);
            font-weight: 600;
        }

        .chat-widget-header small {
            opacity: 0.8;
            font-weight: 400;
        }

        .chat-fullscreen-btn {
            margin-left: auto;
            background: transparent;
            border: none;
            color: var(--bg-dark);
            cursor: pointer;
            padding: 0.25rem;
            border-radius: 0.25rem;
            font-size: 1.1rem;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .chat-fullscreen-btn:hover {
            opacity: 1;
        }

        .chat-widget-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .chat-widget-msg {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            font-size: 0.9rem;
            line-height: 1.5;
            animation: msgFadeIn 0.2s ease-out;
        }

        @keyframes msgFadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .chat-widget-msg.user {
            background: var(--accent);
            color: var(--bg-dark);
            align-self: flex-end;
            border-bottom-right-radius: 0.25rem;
        }

        .chat-widget-msg.assistant {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            color: var(--text-primary);
            align-self: flex-start;
            border-bottom-left-radius: 0.25rem;
        }

        .chat-widget-input {
            padding: 0.75rem;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 0.5rem;
        }

        .chat-widget-input input {
            flex: 1;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.5rem 0.75rem;
            color: var(--text-primary);
            font-size: 0.875rem;
        }

        .chat-widget-input input:focus {
            outline: none;
            border-color: var(--accent);
        }

        .chat-widget-input button {
            background: var(--accent);
            border: none;
            border-radius: 0.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .chat-widget-input button:hover {
            background: var(--accent-dim);
            transform: scale(1.05);
        }

        .chat-widget-typing {
            display: flex;
            gap: 0.25rem;
            padding: 0.75rem 1rem;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            width: fit-content;
            align-self: flex-start;
        }

        .chat-widget-typing span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: widgetTyping 1.4s infinite;
        }

        .chat-widget-typing span:nth-child(2) { animation-delay: 0.2s; }
        .chat-widget-typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes widgetTyping {
            0%, 100% { opacity: 0.3; transform: translateY(0); }
            50% { opacity: 1; transform: translateY(-3px); }
        }

        .timer-widget {
            background: var(--bg-card);
            border: 1px solid var(--accent-dim);
            padding: 0.375rem 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .floating-tools {
            position: fixed;
            bottom: 1.5rem;
            right: max(1.5rem, env(safe-area-inset-right));
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 9999;
        }

        .timer-widget .timer-date {
            color: var(--text-muted);
            font-size: 0.7rem;
            border-right: 1px solid var(--accent-dim);
            padding-right: 0.5rem;
            margin-right: 0.25rem;
        }

        @keyframes timerFadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Agent Workspace - Circular Layout */
        .agent-workspace {
            padding: 1rem;
            position: relative;
            min-height: 500px;
            display: flex;
            align-items: stretch;
        }

        /* Workspace Sidebar - Equal Height Cards */
        .workspace-sidebar {
            width: 400px;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.75rem;
            overflow-y: auto;
        }

        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--accent-dim);
            border-radius: 0;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-card-header {
            background: var(--bg-dark);
            border-bottom: 1px solid var(--accent-dim);
            padding: 0.5rem 0.75rem;
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-card-body {
            flex: 1;
            overflow-y: auto;
            padding: 0;
        }

        .sidebar-card-body .empty-state {
            padding: 1.5rem;
        }

        /* Agent */
        .agent-center {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            flex: 1;
            min-height: 180px;
        }

        .agent-avatar {
            width: 110px;
            height: 110px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dim) 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--bg-dark);
            position: relative;
            animation: agentFloat 3s ease-in-out infinite;
            box-shadow: 0 0 30px var(--accent-glow), 0 0 60px rgba(34, 197, 94, 0.2);
        }

        .agent-avatar::before {
            content: '';
            position: absolute;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            animation: agentRing 2s ease-out infinite;
        }

        .agent-avatar::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 1px solid var(--accent);
            opacity: 0.5;
            animation: agentRing 2s ease-out infinite 0.5s;
        }

        @keyframes agentFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes agentRing {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.3); opacity: 0; }
        }

        .agent-status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .agent-status-dot {
            width: 10px;
            height: 10px;
            background: var(--accent);
            border-radius: 50%;
            animation: agentPulse 1.5s infinite;
        }

        @keyframes agentPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 5px var(--accent); }
            50% { opacity: 0.6; box-shadow: 0 0 15px var(--accent); }
        }

        .agent-task {
            margin-top: 0.5rem;
            font-size: 1rem;
            color: var(--text-primary);
            font-weight: 500;
            max-width: 180px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Orbiting Components */
        .orbit-container {
            position: relative;
            width: calc(100% - 415px);
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 0;
            gap: 1rem;
            overflow: hidden;
        }

        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            border: 1px dashed var(--border);
            opacity: 0.3;
        }

        .orbit-ring-1 {
            width: 280px;
            height: 280px;
        }

        .orbit-ring-2 {
            width: 420px;
            height: 420px;
        }

        /* Orbital Widgets - Positioned in circular layout */
        .orbital-widget {
            position: absolute;
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 0.6rem;
            min-width: 110px;
            max-width: 120px;
            animation: widgetFloat 4s ease-in-out infinite;
        }

        .orbital-widget.top { top: 25px; left: 50%; transform: translateX(-50%); }
        .orbital-widget.bottom { bottom: 25px; left: 50%; transform: translateX(-50%); }
        .orbital-widget.left { left: 20px; top: 50%; transform: translateY(-50%); }
        .orbital-widget.right { right: 20px; top: 50%; transform: translateY(-50%); }

        .orbital-widget.top-left { top: 60px; left: 60px; }
        .orbital-widget.top-right { top: 60px; right: 60px; }
        .orbital-widget.bottom-left { bottom: 60px; left: 60px; }
        .orbital-widget.bottom-right { bottom: 60px; right: 60px; }

        @keyframes widgetFloat {
            0%, 100% { transform: translateY(0) translateX(var(--float-x, 0)); }
            50% { transform: translateY(-3px) translateX(var(--float-x, 0)); }
        }

        .orbital-widget.top { --float-x: -50%; animation-delay: 0s; }
        .orbital-widget.bottom { --float-x: -50%; animation-delay: 0.5s; }
        .orbital-widget.left { --float-x: 0; animation-delay: 1s; }
        .orbital-widget.right { --float-x: 0; animation-delay: 1.5s; }
        .orbital-widget.top-left { animation-delay: 0.3s; }
        .orbital-widget.top-right { animation-delay: 0.7s; }
        .orbital-widget.bottom-left { animation-delay: 1.2s; }
        .orbital-widget.bottom-right { animation-delay: 1.7s; }

        /* Metrics section */
        .metrics-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        /* Info widget rows */
        .info-widget-row,
        .info-widget-row-2 {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            padding: 0 0.5rem;
        }

        .orbital-widget-info {
            background: var(--bg-dark);
            border: 1px solid var(--border);
            border-radius: 0.5rem;
            padding: 0.6rem 1rem;
            min-width: 95px;
            text-align: center;
            animation: widgetFloat 4s ease-in-out infinite;
        }

        .orbital-widget-info .widget-title {
            font-size: 0.6rem;
            margin-bottom: 0.25rem;
        }

        .orbital-widget-info .widget-value {
            font-size: 1.25rem;
        }

        .orbital-widget-info .widget-sub {
            font-size: 0.55rem;
        }

        /* Reasoning panel */
        .reasoning-panel {
            width: 100%;
            max-width: 560px;
            max-height: 160px;
            background: var(--bg-dark);
            border: 1px solid var(--accent-dim);
            border-radius: 0.5rem;
            overflow: hidden;
            z-index: 6;
            flex-shrink: 0;
        }

        .reasoning-messages {
            padding: 0.5rem;
            max-height: 110px;
            overflow-y: auto;
            font-size: 0.65rem;
        }

        /* Responsive Design */
        @media (max-width: 992px) {
            .orbit-container {
                width: 100%;
            }
            .info-widget-row, .info-widget-row-2 {
                justify-content: center;
                gap: 0.375rem;
            }
            .orbital-widget-info {
                min-width: 80px;
                max-width: 120px;
                padding: 0.4rem;
            }
            .orbital-widget-info .widget-title {
                font-size: 0.5rem;
            }
            .orbital-widget-info .widget-value {
                font-size: 1.1rem;
            }
            .reasoning-panel {
                max-width: 320px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                padding: 0.5rem;
            }
            .navbar-brand span {
                display: none;
            }
            .nav-pills .nav-link {
                padding: 0.375rem 0.5rem;
                font-size: 0.75rem;
            }
            .nav-pills .nav-link i {
                margin-right: 0;
            }
            .agent-workspace {
                min-height: 500px;
                flex-direction: column;
            }
            .workspace-sidebar {
                width: 100% !important;
                min-width: 100% !important;
                flex-direction: row;
                overflow-x: auto;
                padding: 0.5rem !important;
            }
            .workspace-sidebar .sidebar-card {
                min-width: 180px;
                flex: 1 0 auto;
            }
            .agent-avatar {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
            .orbital-widget-info {
                min-width: 70px;
                max-width: 90px;
                padding: 0.3rem;
            }
            .orbital-widget-info .widget-title {
                font-size: 0.35rem;
            }
            .orbital-widget-info .widget-value {
                font-size: 1rem;
            }
            .orbital-widget-info .widget-sub {
                font-size: 0.3rem;
            }
            .reasoning-panel {
                display: none;
            }
            .agent-task {
                max-width: 100px;
            }
            .chat-widget-popup {
                width: calc(100vw - 1rem);
                right: 0.5rem;
                bottom: 4rem;
            }
            .floating-tools {
                bottom: 1rem;
                right: 1rem;
            }
            .timer-widget {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .col-lg-9 { order: 1; }
            .col-lg-3 { order: 2; margin-top: 1rem; }
            .stat-value { font-size: 1.75rem; }
            .card { margin-bottom: 0.5rem; }
        }

        .reasoning-header {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--accent);
            padding: 0.375rem 0.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .reasoning-msg {
            padding: 0.2rem 0.375rem;
            margin-bottom: 0.2rem;
            border-radius: 0.25rem;
            background: var(--bg-card);
            color: var(--text-primary);
            animation: msgSlide 0.3s ease-out;
        }

        .reasoning-msg.system {
            color: var(--text-muted);
            font-style: italic;
        }

        .reasoning-msg.agent {
            border-left: 2px solid var(--accent);
        }

        .reasoning-msg.thinking {
            color: var(--warning);
        }

        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .widget-title {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.375rem;
        }

        .widget-title i {
            color: var(--accent);
        }

        .widget-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .widget-sub {
            font-size: 0.65rem;
            color: var(--text-muted);
        }

        /* Mini Processing Grid */
        .mini-grid {
            display: flex;
            gap: 0.35rem;
            margin-top: 0.5rem;
        }

        .mini-node {
            width: 28px;
            height: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 0.35rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .mini-node.active {
            background: var(--accent-glow);
            border-color: var(--accent);
            color: var(--accent);
            animation: miniPulse 0.5s ease;
        }

        @keyframes miniPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* Mini Memory Blocks */
        .mini-memory {
            display: flex;
            gap: 0.15rem;
            margin-top: 0.5rem;
        }

        .mini-mem-block {
            width: 16px;
            height: 20px;
            background: var(--bg-card);
            border-radius: 3px;
        }

        .mini-mem-block.used {
            background: var(--accent);
        }

        /* Mini Task Items */
        .mini-tasks {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            max-height: 90px;
            overflow: hidden;
        }

        .mini-task {
            font-size: 0.65rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.25rem;
            animation: miniTaskSlide 2s ease forwards;
        }

        .mini-task i {
            color: var(--accent);
            font-size: 0.5rem;
        }

        @keyframes miniTaskSlide {
            0% { opacity: 0; transform: translateX(-10px); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Mini Data Stream */
        .mini-stream {
            display: flex;
            gap: 0.375rem;
            overflow: hidden;
            margin-top: 0.5rem;
        }

        .mini-stream-item {
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.55rem;
            background: var(--bg-card);
            white-space: nowrap;
            animation: miniStream 2s ease forwards;
        }

        .mini-stream-item.sensor { border-left: 2px solid var(--info); }
        .mini-stream-item.detection { border-left: 2px solid var(--danger); }
        .mini-stream-item.event { border-left: 2px solid var(--accent); }
        .mini-stream-item.warning { border-left: 2px solid var(--warning); }

        @keyframes miniStream {
            0% { opacity: 0; transform: translateX(10px); }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }

        /* Progress Bars */
        .mini-progress {
            height: 4px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 0.5rem;
            overflow: hidden;
        }

        .mini-progress-bar {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            animation: progressMove 2s ease infinite;
        }

        @keyframes progressMove {
            0% { width: 0%; margin-left: 0%; }
            50% { width: 50%; margin-left: 25%; }
            100% { width: 0%; margin-left: 100%; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }

        
    </style>
    {% block extra_styles %}{% endblock %}
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-check"></i>
                <span>Phantom</span>
            </a>
            
            <ul class="nav nav-pills ms-auto gap-2">
                <li class="nav-item">
                    <a class="nav-link" href="/" id="nav-home">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/diagnostics" id="nav-diag">
                        <i class="bi bi-cpu"></i> Diagnostics
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/reports" id="nav-reports">
                        <i class="bi bi-file-earmark-ruled"></i> Reports
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/docs" id="nav-docs">
                        <i class="bi bi-book"></i> Docs
                    </a>
                </li>
            </ul>
            
            <div class="status-badge ms-2 ms-lg-4">
                <span class="status-dot online" id="globalStatus"></span>
                <span id="statusText">Phantom Online</span>
            </div>
        </div>
    </nav>

    <main id="main-content" class="container-fluid py-4" style="padding-bottom: 6rem;">
        {% block content %}{% endblock %}
    </main>

    <div class="activity-pulse" id="activityIndicator" style="display: none;"></div>

    <!-- Floating Timer + Chat Button -->
    <div class="floating-tools">
        <!-- Floating Timer -->
        <div class="timer-widget">
            <span class="timer-date" id="timerDate"></span>
            <i class="bi bi-clock"></i>
            <span id="floatingTimer">00:00:00</span>
        </div>
        
        <!-- Chat Widget Button -->
        <button class="chat-widget-btn" id="chatWidgetBtn" onclick="toggleChatWidget()" aria-label="Open Phantom Assistant">
            <i class="bi bi-chat-dots-fill"></i>
            <i class="bi bi-x-lg"></i>
            <span class="notification-badge" id="chatNotifBadge">0</span>
        </button>
    </div>

    <!-- Chat Widget Popup -->
    <div class="chat-widget-popup" id="chatWidgetPopup" aria-live="polite">
        <div class="chat-widget-header">
            <i class="bi bi-robot"></i>
            <div>
                Phantom Assistant
                <small class="d-block">AI Security Agent</small>
            </div>
            <button class="chat-fullscreen-btn" onclick="toggleChatFullscreen()" title="Toggle fullscreen" aria-label="Toggle assistant fullscreen">
                <i class="bi bi-arrows-angle-expand" id="chatFullscreenIcon"></i>
            </button>
        </div>
        <div class="chat-widget-messages" id="chatWidgetMessages">
            <div class="chat-widget-msg assistant">Hello! How can I help you with security monitoring today?</div>
        </div>
        <div class="chat-widget-input">
            <label for="chatWidgetInput" class="visually-hidden">Assistant Message</label>
            <input type="text" id="chatWidgetInput" name="chat_message" autocomplete="off" placeholder="Ask me anything..." 
                   onkeypress="if(event.key === 'Enter') sendWidgetMessage()">
            <button onclick="sendWidgetMessage()" aria-label="Send assistant message">
                <i class="bi bi-send" style="color: var(--bg-dark);"></i>
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
        // Set active nav
        const path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === path) {
                link.classList.add('active');
            }
        });
        
        // Activity indicator
        let lastActivity = Date.now();
        function showActivity() {
            document.getElementById('activityIndicator').style.display = 'block';
            lastActivity = Date.now();
            setTimeout(() => {
                if (Date.now() - lastActivity >= 500) {
                    document.getElementById('activityIndicator').style.display = 'none';
                }
            }, 1000);
        }
        
        // Global error handler
        window.onerror = function(msg, url, line) {
            console.error('Error:', msg, 'at line', line);
            return false;
        };
        
        // Reconnect handler
        let reconnectAttempts = 0;
        function updateGlobalStatus(data) {
            const dot = document.getElementById('globalStatus');
            const text = document.getElementById('statusText');
            if (!dot || !text) return;
            if (!data || data.status !== 'running') {
                dot.className = 'status-dot offline';
                text.textContent = 'Offline';
                return;
            }
            const llm = data.llm_health || {};
            if (llm.configured && llm.status !== 'reachable') {
                dot.className = 'status-dot warning';
                text.textContent = 'Online / LLM degraded';
                return;
            }
            dot.className = 'status-dot online';
            text.textContent = 'System Online';
        }

        function scheduleReconnect() {
            if (reconnectAttempts < 5) {
                reconnectAttempts++;
                setTimeout(() => {
                    fetch('/api/status').then(r => {
                        if (!r.ok) throw new Error('status unavailable');
                        return r.json();
                    }).then(data => {
                        reconnectAttempts = 0;
                        updateGlobalStatus(data);
                    }).catch(() => scheduleReconnect());
                }, 3000 * reconnectAttempts);
            }
        }
        
        function pollGlobalStatus() {
            fetch('/api/status')
                .then(r => {
                    if (!r.ok) throw new Error('status unavailable');
                    return r.json();
                })
                .then(data => {
                    reconnectAttempts = 0;
                    updateGlobalStatus(data);
                })
                .catch(() => {
                document.getElementById('globalStatus').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Reconnecting...';
                scheduleReconnect();
            });
        }
        pollGlobalStatus();
        setInterval(pollGlobalStatus, 30000);

        // Floating timer — shows current date and local clock time
        function updateFloatingTimer() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            const secs = String(now.getSeconds()).padStart(2, '0');

            const timerEl = document.getElementById('floatingTimer');
            if (timerEl) timerEl.textContent = `${hrs}:${mins}:${secs}`;

            const dateEl = document.getElementById('timerDate');
            if (dateEl) {
                dateEl.textContent = now.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            }
        }
        setInterval(updateFloatingTimer, 1000);
        updateFloatingTimer();

        // Escape HTML to prevent XSS
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function appendChatBubble(role, text) {
            const container = document.getElementById('chatWidgetMessages');
            const bubble = document.createElement('div');
            bubble.className = `chat-widget-msg ${role}`;
            bubble.textContent = text;
            container.appendChild(bubble);
            container.scrollTop = container.scrollHeight;
        }

        function loadChatHistory() {
            fetch('/api/chat/history')
                .then(r => r.json())
                .then(messages => {
                    const container = document.getElementById('chatWidgetMessages');
                    container.innerHTML = '';
                    if (!messages || messages.length === 0) {
                        container.innerHTML = '<div class="chat-widget-msg assistant">Hello! How can I help you with security monitoring today?</div>';
                        return;
                    }
                    messages.forEach(m => {
                        const role = m.role === 'assistant' ? 'assistant' : 'user';
                        appendChatBubble(role, m.content);
                    });
                })
                .catch(() => {
                    // keep default greeting on error
                });
        }

        // Chat Widget
        function toggleChatWidget() {
            const btn = document.getElementById('chatWidgetBtn');
            const popup = document.getElementById('chatWidgetPopup');
            btn.classList.toggle('open');
            popup.classList.toggle('show');
        }

        function toggleChatFullscreen() {
            const popup = document.getElementById('chatWidgetPopup');
            const icon = document.getElementById('chatFullscreenIcon');
            popup.classList.toggle('fullscreen');
            if (popup.classList.contains('fullscreen')) {
                icon.className = 'bi bi-arrows-angle-contract';
            } else {
                icon.className = 'bi bi-arrows-angle-expand';
            }
        }

        function sendWidgetMessage() {
            const input = document.getElementById('chatWidgetInput');
            const msg = input.value.trim();
            if (!msg) return;
            input.value = '';
            const container = document.getElementById('chatWidgetMessages');
            appendChatBubble('user', msg);
            const typing = document.createElement('div');
            typing.className = 'chat-widget-typing';
            typing.id = 'widgetTyping';
            typing.innerHTML = '<span></span><span></span><span></span>';
            container.appendChild(typing);
            container.scrollTop = container.scrollHeight;
            fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({message: msg})
            })
            .then(r => r.json())
            .then(data => {
                document.getElementById('widgetTyping')?.remove();
                if (data.response) {
                    appendChatBubble('assistant', data.response);
                }
                container.scrollTop = container.scrollHeight;
                hideChatNotification();
            })
            .catch(() => {
                document.getElementById('widgetTyping')?.remove();
                appendChatBubble('assistant', 'Sorry, I encountered an error.');
            });
        }

        // Chat notification
        let unreadCount = 0;
        function showChatNotification(count) {
            const badge = document.getElementById('chatNotifBadge');
            if (count > 0 && !document.getElementById('chatWidgetPopup').classList.contains('show')) {
                unreadCount = count;
                badge.textContent = count > 9 ? '9+' : count;
                badge.classList.add('show');
            }
        }

        function hideChatNotification() {
            unreadCount = 0;
            document.getElementById('chatNotifBadge').classList.remove('show');
        }

        // Poll for notifications
        setInterval(() => {
            fetch('/api/alerts')
                .then(r => r.json())
                .then(data => {
                    const unacknowledged = data.alerts?.filter(a => ['pending', 'routed'].includes(a.status)).length || 0;
                    showChatNotification(unacknowledged);
                })
                .catch(() => {});
        }, 30000);

        // Load persistent chat history on page load
        loadChatHistory();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
