<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Monica Mission Control{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b;
            --bg-card: #18181b;
            --bg-card-hover: #1f1f23;
            --border: #27272a;
            --border-light: #3f3f46;
            --text-primary: #fafafa;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #22c55e;
            --accent-dim: #16a34a;
            --accent-glow: rgba(34, 197, 94, 0.15);
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --info: #3b82f6;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
        }
        
        /* Navbar */
        .navbar {
            background: rgba(9, 9, 11, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--text-primary) !important;
        }
        
        .navbar-brand i {
            color: var(--accent);
            font-size: 1.5rem;
        }
        
        .nav-pills .nav-link {
            color: var(--text-secondary);
            border-radius: 0.5rem;
            padding: 0.5rem 1rem;
            font-weight: 500;
            font-size: 0.875rem;
            transition: all 0.2s ease;
        }
        
        .nav-pills .nav-link:hover {
            color: var(--text-primary);
            background: var(--bg-card);
        }
        
        .nav-pills .nav-link.active {
            background: var(--accent);
            color: var(--bg-dark);
        }
        
        .nav-pills .nav-link i {
            margin-right: 0.375rem;
        }
        
        /* Status badge */
        .status-badge {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.375rem 0.75rem;
            background: var(--bg-card);
            border-radius: 9999px;
            border: 1px solid var(--border);
            font-size: 0.75rem;
            font-weight: 500;
        }
        
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
        .status-dot.warning { background: var(--warning); }
        .status-dot.offline { background: var(--danger); }
        
        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 1rem;
            overflow: hidden;
            transition: all 0.2s ease;
        }
        
        .card:hover {
            border-color: var(--border-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
        }
        
        .card-header {
            background: transparent;
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.25rem;
            font-weight: 600;
            font-size: 0.875rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .card-header i {
            margin-right: 0.5rem;
            color: var(--accent);
        }
        
        .card-body {
            padding: 1.25rem;
        }
        
        /* Stats cards */
        .stat-card {
            text-align: center;
            padding: 1.5rem;
        }
        
        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            line-height: 1;
            margin-bottom: 0.25rem;
        }
        
        .stat-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        
        .stat-card.green .stat-value { color: var(--success); }
        .stat-card.yellow .stat-value { color: var(--warning); }
        .stat-card.red .stat-value { color: var(--danger); }
        .stat-card.blue .stat-value { color: var(--info); }
        
        /* Buttons */
        .btn-accent {
            background: var(--accent);
            color: var(--bg-dark);
            border: none;
            font-weight: 600;
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }
        
        .btn-accent:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
        }
        
        .btn-outline-accent {
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            font-weight: 500;
        }
        
        .btn-outline-accent:hover {
            background: var(--accent-glow);
        }
        
        /* Log entries */
        .log-container {
            max-height: 400px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        
        .log-entry {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            transition: background 0.15s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .log-entry:hover {
            background: var(--bg-card-hover);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-timestamp {
            color: var(--text-muted);
            font-size: 0.7rem;
            white-space: nowrap;
        }
        
        .log-badge {
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .log-badge.process { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .log-badge.port { background: rgba(168, 85, 247, 0.15); color: #c084fc; }
        .log-badge.file { background: rgba(34, 197, 94, 0.15); color: #4ade80; }
        .log-badge.detection { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        
        /* Activity indicator */
        .activity-pulse {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            animation: activity-pulse 1.5s infinite;
        }
        
        @keyframes activity-pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.5); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* Quick action cards */
        .action-card {
            padding: 1.5rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .action-card:hover {
            background: var(--accent-glow);
            border-color: var(--accent);
        }
        
        .action-card i {
            font-size: 2rem;
            margin-bottom: 0.75rem;
            color: var(--accent);
        }
        
        .action-card h6 {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .action-card p {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin: 0;
        }
        
        /* Sidebar */
        .sidebar {
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
        }
        
        .sidebar-section {
            margin-bottom: 1.5rem;
        }
        
        .sidebar-title {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 0.75rem;
        }
        
        /* Animations */
        .fade-in {
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .slide-in {
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--border-light);
        }
        
        {% block extra_styles %}{% endblock %}
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">
                <i class="bi bi-shield-check"></i>
                <span>Monica</span>
            </a>
            
            <ul class="nav nav-pills ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/" id="nav-home">
                        <i class="bi bi-grid-1x2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/chat" id="nav-chat">
                        <i class="bi bi-chat-dots"></i> Chat
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/diagnostics" id="nav-diag">
                        <i class="bi bi-cpu"></i> Diagnostics
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/monitor" id="nav-monitor">
                        <i class="bi bi-graph-up-arrow"></i> Monitor
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/reports" id="nav-reports">
                        <i class="bi bi-file-earmark-ruled"></i> Reports
                    </a>
                </li>
            </ul>
            
            <div class="status-badge ms-4">
                <span class="status-dot online" id="globalStatus"></span>
                <span id="statusText">Monica Online</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid py-4">
        {% block content %}{% endblock %}
    </div>

    <div class="activity-pulse" id="activityIndicator" style="display: none;"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
    <script>
        // Set active nav
        const path = window.location.pathname;
        document.querySelectorAll('.nav-link').forEach(link => {
            if (link.getAttribute('href') === path) {
                link.classList.add('active');
            }
        });
        
        // Activity indicator
        let lastActivity = Date.now();
        function showActivity() {
            document.getElementById('activityIndicator').style.display = 'block';
            lastActivity = Date.now();
            setTimeout(() => {
                if (Date.now() - lastActivity >= 500) {
                    document.getElementById('activityIndicator').style.display = 'none';
                }
            }, 1000);
        }
        
        // Global error handler
        window.onerror = function(msg, url, line) {
            console.error('Error:', msg, 'at line', line);
            return false;
        };
        
        // Reconnect handler
        let reconnectAttempts = 0;
        function scheduleReconnect() {
            if (reconnectAttempts < 5) {
                reconnectAttempts++;
                setTimeout(() => {
                    fetch('/api/status').then(() => {
                        reconnectAttempts = 0;
                        document.getElementById('globalStatus').className = 'status-dot online';
                        document.getElementById('statusText').textContent = 'System Online';
                    }).catch(() => scheduleReconnect());
                }, 3000 * reconnectAttempts);
            }
        }
        
        setInterval(() => {
            fetch('/api/status').catch(() => {
                document.getElementById('globalStatus').className = 'status-dot offline';
                document.getElementById('statusText').textContent = 'Reconnecting...';
                scheduleReconnect();
            });
        }, 30000);
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
